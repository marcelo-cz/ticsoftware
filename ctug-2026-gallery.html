<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTUG 2026 Gallery | TIC Software</title>
    <meta name="description" content="Event photos from CTUG 2026 conference">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #7F1D1D;
            --light-blue: #991B1B;
            --accent-blue: #FEE2E2;
            --dark-text: #1F2937;
            --white: #FFFFFF;
            --light-gray: #FEF2F2;
            --border-gray: #FCA5A5;
            --gradient-primary: linear-gradient(135deg, #7F1D1D 0%, #991B1B 100%);
            --gradient-accent: linear-gradient(135deg, #7F1D1D 0%, #B91C1C 100%);
        }

        body {
            font-family: 'Mulish', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--dark-text);
            background-color: var(--white);
            line-height: 1.6;
        }

        /* Header & Navigation */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--white);
            border-bottom: 2px solid var(--border-gray);
            padding: 1rem 0;
            box-shadow: 0 2px 8px rgba(127, 29, 29, 0.08);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            height: 80px;
        }

        .logo img {
            height: 100%;
            width: auto;
            object-fit: contain;
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
            flex-wrap: nowrap;
        }

        nav a {
            text-decoration: none;
            color: var(--dark-text);
            font-weight: 500;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: #991B1B;
        }

        .nav-dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            background-color: var(--white);
            min-width: 160px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            z-index: 1;
            border-radius: 4px;
            border: 1px solid var(--border-gray);
            top: 100%;
            left: 0;
        }

        .dropdown-menu a {
            display: block;
            padding: 0.75rem 1rem;
            text-decoration: none;
            color: var(--dark-text);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .dropdown-menu a:hover {
            background-color: var(--light-gray);
            color: #991B1B;
        }

        .nav-dropdown:hover .dropdown-menu {
            display: block;
        }

        /* Hero Section */
        .hero {
            background: var(--gradient-primary);
            color: var(--white);
            padding: 3rem 2rem;
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .hero p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        /* Main Content */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem 3rem;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 20px rgba(127, 29, 29, 0.15);
        }

        .gallery-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(153, 27, 27, 0.25);
        }

        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* Lightbox Modal */
        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            animation: fadeIn 0.3s;
        }

        .lightbox-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
            animation: zoomIn 0.3s;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .lightbox-content img {
            width: 100%;
            height: auto;
            max-height: 85vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: var(--white);
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.3s;
            background: none;
            border: none;
            padding: 0;
        }

        .lightbox-close:hover {
            transform: rotate(90deg) scale(1.2);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(127, 29, 29, 0.4);
            color: var(--white);
            border: none;
            padding: 1rem;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s;
            z-index: 2001;
            backdrop-filter: blur(10px);
            border-radius: 8px;
        }

        .lightbox-nav:hover {
            background: rgba(153, 27, 27, 0.7);
            transform: translateY(-50%) scale(1.1);
        }

        .lightbox-prev {
            left: 0;
        }

        .lightbox-next {
            right: 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .lightbox-content {
                max-width: 95%;
            }

            .lightbox-nav {
                padding: 0.75rem;
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .hero {
                padding: 2rem 1rem;
            }

            .hero h1 {
                font-size: 1.5rem;
            }

            main {
                padding: 0 1rem 2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="./images/Logos/Leading_Modernization_with_ai.png" alt="TIC Software">
            </a>
            <nav>
                <a href="index.html#home" class="active">Home</a>
                <div class="nav-dropdown">
                    <a href="index.html#about">About Us</a>
                    <div class="dropdown-menu">
                        <a href="who-we-are.html">Who We Are</a>
                        <a href="ticteam.html">TIC Team</a>
                        <a href="our-partners.html">Our Partners</a>
                        <a href="our-clients.html">Our Clients</a>
                    </div>
                </div>
                <div class="nav-dropdown">
                    <a href="index.html#products">Products</a>
                    <div class="dropdown-menu">
                        <a href="messaging.html">Messaging</a>
                        <a href="gateway.html">Gateway</a>
                        <a href="business-intelligence.html">Business Intelligence</a>
                        <a href="modernize.html">Modernize</a>
                    </div>
                </div>
                <div class="nav-dropdown">
                    <a href="index.html#services">Services</a>
                    <div class="dropdown-menu">
                        <a href="consulting.html">Consulting</a>
                        <a href="cloud.html">Cloud</a>
                        <a href="https://ticsoftware.ai/" target="_blank">GenAI</a>
                    </div>
                </div>
                <div class="nav-dropdown">
                    <a href="index.html#resources">Resources</a>
                    <div class="dropdown-menu">
                        <a href="success-stories.html">Success Stories</a>
                        <a href="tic-news.html">TIC News</a>
                        <a href="blog.html">Blog</a>
                    </div>
                </div>
                <a href="ticteam.html#get-in-touch">Contact Us</a>
            </nav>
        </div>
    </header>

    <div class="hero">
        <h1>CTUG 2026 Gallery</h1>
        <p>Event highlights and moments from the conference</p>
    </div>

    <main>
        <div class="gallery-grid">
            <div class="gallery-item" onclick="openLightbox(0)">
                <img src="./images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5204.jpeg" alt="CTUG 2026 - Photo 1">
            </div>
            <div class="gallery-item" onclick="openLightbox(1)">
                <img src="./images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5205_sm.jpg" alt="CTUG 2026 - Photo 2">
            </div>
            <div class="gallery-item" onclick="openLightbox(2)">
                <img src="./images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5206_sm.jpg" alt="CTUG 2026 - Photo 3">
            </div>
            <div class="gallery-item" onclick="openLightbox(3)">
                <img src="./images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5207_sm.jpg" alt="CTUG 2026 - Photo 4">
            </div>
            <div class="gallery-item" onclick="openLightbox(4)">
                <img src="./images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5208_sm.jpg" alt="CTUG 2026 - Photo 5">
            </div>
            <div class="gallery-item" onclick="openLightbox(5)">
                <img src="./images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5210_sm.jpg" alt="CTUG 2026 - Photo 6">
            </div>
            <div class="gallery-item" onclick="openLightbox(6)">
                <img src="./images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5213_sm.jpg" alt="CTUG 2026 - Photo 7">
            </div>
            <div class="gallery-item" onclick="openLightbox(7)">
                <img src="./images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5214_sm.jpg" alt="CTUG 2026 - Photo 8">
            </div>
            <div class="gallery-item" onclick="openLightbox(8)">
                <img src="./images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5217_sm.jpg" alt="CTUG 2026 - Photo 9">
            </div>
            <div class="gallery-item" onclick="openLightbox(9)">
                <img src="./images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5222_sm.jpg" alt="CTUG 2026 - Photo 10">
            </div>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox-modal">
        <button class="lightbox-nav lightbox-prev" onclick="changeLightboxImage(-1)">❮</button>
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox()">✕</button>
            <img id="lightbox-img" src="" alt="Full size gallery image">
        </div>
        <button class="lightbox-nav lightbox-next" onclick="changeLightboxImage(1)">❯</button>
    </div>

    <script>
        const images = [
            './images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5204.jpeg',
            './images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5205_sm.jpg',
            './images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5206_sm.jpg',
            './images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5207_sm.jpg',
            './images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5208_sm.jpg',
            './images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5210_sm.jpg',
            './images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5213_sm.jpg',
            './images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5214_sm.jpg',
            './images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5217_sm.jpg',
            './images/Conference Galleries/CTUG Album/CTUG 2026/IMG_5222_sm.jpg'
        ];
        let currentImageIndex = 0;

        function openLightbox(index) {
            currentImageIndex = index;
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = images[currentImageIndex];
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function changeLightboxImage(direction) {
            currentImageIndex += direction;
            if (currentImageIndex >= images.length) {
                currentImageIndex = 0;
            } else if (currentImageIndex < 0) {
                currentImageIndex = images.length - 1;
            }
            document.getElementById('lightbox-img').src = images[currentImageIndex];
        }

        // Close lightbox when clicking outside the image
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.classList.contains('active')) {
                if (e.key === 'ArrowLeft') changeLightboxImage(-1);
                if (e.key === 'ArrowRight') changeLightboxImage(1);
                if (e.key === 'Escape') closeLightbox();
            }
        });
    </script>
</body>
